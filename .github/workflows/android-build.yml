name: Build debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          # the default also asks for the removed 'tools' package, which makes sdkmanager fail
          packages: platform-tools

      - name: Install SDK platform + build-tools
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"   # AGP 8.5.x needs Gradle >= 8.7; there's no wrapper in the repo

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: obd-logger-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
