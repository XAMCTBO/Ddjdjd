name: AI server tests

on:
  push:
    paths: [ "ai-server/**", ".github/workflows/ai-server-tests.yml" ]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r ai-server/requirements.txt
      - name: Unit + HTTP tests (offline, no API calls)
        working-directory: ai-server
        run: python -m unittest discover -s tests -v
